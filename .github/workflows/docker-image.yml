
name: Build and Push Docker Image

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the code
        uses: actions/checkout@v4

      - name: Build the Docker image
        run: docker build -t react-app:latest .

      - name: Save the Docker image
        run: docker save -o image.tar react-app:latest

      - name: Upload the image artifact
        uses: actions/upload-artifact@v4
        with:
          name: docker-image
          path: image.tar
          retention-days: 1

  trivy-scanning:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Download the artifact
        uses: actions/download-artifact@v4
        with:
          name: docker-image

      - name: Load the Docker image
        run: docker load -i image.tar

      - name: Scan the Docker image
        uses: aquasecurity/trivy-action@0.36.0
        with:
          image-ref: react-app:latest
          scan-type: image
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'

  tag-and-push:
    runs-on: ubuntu-latest
    needs: [build, trivy-scanning]
    # Do not push images from pull requests
    if: github.event_name != 'pull_request'
    steps:
      - name: Download the image artifact
        uses: actions/download-artifact@v4
        with:
          name: docker-image

      - name: Load the Docker image
        run: docker load -i image.tar

      - name: Tag the image
        run: docker image tag react-app:latest ${{ secrets.DOCKERUSER }}/react-app:latest

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERUSER }}
          password: ${{ secrets.DOCKERAPI }}

      - name: Push the Docker image
        run: docker push ${{ secrets.DOCKERUSER }}/react-app:latest
